services:
  fastapi-app:
    build: .
    container_name: hkquant_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    volumes:
      - ./logs:/app/logs

  ttlock-api:
      build: ./api_ttlock           # 指向你存放 main.py 的目錄
      container_name: hkquant_api_ttlock
      restart: always
      env_file:
        - ./api_ttlock/.env

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: hkquant_npm
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt